{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Playbooks</h1>
    <a class="btn btn-primary" href="{% url 'playbook_create' %}">Nuevo</a>
</div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Severidad mínima</th>
            <th>Modo</th>
            <th>Habilitado</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for playbook in playbooks %}
        <tr>
            <td>{{ playbook.name }}</td>
            <td>{{ playbook.min_severity }}</td>
            <td>{{ playbook.mode }}</td>
            <td>{{ playbook.enabled }}</td>
            <td><a class="btn btn-sm btn-outline-secondary" href="{% url 'playbook_edit' playbook.id %}">Editar</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5">Sin playbooks</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
