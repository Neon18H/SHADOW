<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SHADOW SOAR | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1b2845, #0b1220);
            color: #d5def5;
        }
        .login-card {
            background: #111a2b;
            border: 1px solid #1d2940;
            border-radius: 16px;
            padding: 2rem;
        }
        .form-control {
            background: #0f1a31;
            border: 1px solid #1d2940;
            color: #d5def5;
        }
        .form-control:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 0 0.2rem rgba(76, 201, 240, 0.2);
        }
    </style>
</head>
<body>
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="login-card shadow-lg" style="width: 420px;">
        <div class="text-center mb-4">
            <div class="fs-3 fw-semibold">SHADOW SOAR</div>
            <div class="text-secondary">Enterprise SOC Console</div>
        </div>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Usuario</label>
                <input type="text" name="username" class="form-control" autofocus required id="id_username" value="{{ form.username.value|default_if_none:'' }}">
                {% if form.username.errors %}
                    <div class="text-danger small">{{ form.username.errors }}</div>
                {% endif %}
            </div>
            <div class="mb-4">
                <label class="form-label" for="id_password">Contraseña</label>
                <input type="password" name="password" class="form-control" required id="id_password">
                {% if form.password.errors %}
                    <div class="text-danger small">{{ form.password.errors }}</div>
                {% endif %}
            </div>
            <button class="btn btn-info w-100" type="submit">Ingresar</button>
        </form>
    </div>
</div>
</body>
</html>
