{% extends 'core/base.html' %}
{% block content %}
<h1>Auditoría</h1>
<table class="table table-sm">
    <thead>
        <tr>
            <th>Timestamp</th>
            <th>Actor</th>
            <th>Acción</th>
            <th>Objeto</th>
            <th>IP</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.timestamp }}</td>
            <td>{{ log.actor }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.object_type }} {{ log.object_id }}</td>
            <td>{{ log.ip_address }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5">Sin logs</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
